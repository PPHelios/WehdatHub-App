name: Release Android
# Manual: builds the signed app bundle (.aab) for Google Play. Needs the secrets UPLOAD_KEYSTORE_B64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD.
on:
  push:
    branches: [main]
    paths: ["apps/mobile/android/**", "apps/mobile/src/**", "packages/shared/**", ".github/workflows/release-android.yml"]
  workflow_dispatch:
    inputs:
      version_code:
        description: Play version code (must go up with every upload)
        required: true
      version_name:
        description: Version shown to users
        required: true
        default: "1.0.0"

jobs:
  bundle:
    name: Signed Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Write upload key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build bundle
        working-directory: apps/mobile/android
        env:
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: ./gradlew bundleRelease --quiet
      - name: Check Play key is set
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "HAS_PLAY_KEY=${{ env.PLAY_KEY != '' }}" >> "$GITHUB_ENV"
      - name: Upload to Play internal testing
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.wehdathub
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - uses: actions/upload-artifact@v4
        with:
          name: wehdathub-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
